<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff0044"/>
      <stop offset="0.5" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#0088ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="200" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="840" y2="40" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="840" y2="80" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="840" y2="120" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="840" y2="160" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="840" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="420" y1="0" x2="420" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="200" stroke="#00ff88" stroke-width="0.5"/>
  </g>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="840" height="3" fill="url(#accent)"/>
  <rect x="0" y="197" width="840" height="3" fill="url(#accent)"/>

  <!-- Skull/safety icon -->
  <g transform="translate(48, 55)" filter="url(#glow)">
    <path d="M40 0C17.9 0 0 15.7 0 35s17.9 35 40 35 40-15.7 40-35S62.1 0 40 0z" fill="#0d1117" stroke="#00ff88" stroke-width="2"/>
    <circle cx="28" cy="32" r="6" fill="#ff0044"/>
    <circle cx="52" cy="32" r="6" fill="#ff0044"/>
    <rect x="30" y="48" width="20" height="5" rx="2" fill="#00ff88"/>
    <rect x="34" y="55" width="3" height="8" fill="#00ff88"/>
    <rect x="40" y="55" width="3" height="8" fill="#00ff88"/>
    <rect x="46" y="55" width="3" height="8" fill="#00ff88"/>
  </g>

  <!-- Title text -->
  <text x="165" y="70" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#00ff88" filter="url(#glow)">HACK</text>
  <text x="300" y="70" font-family="'Courier New', monospace" font-size="20" fill="#8888aa">// Web Security Toolkit</text>

  <!-- Subtitle -->
  <text x="165" y="98" font-family="'Courier New', monospace" font-size="14" fill="#aaaacc">OWASP ZAP · Playwright CDP · AI Fuzzing · Authenticated Replay</text>

  <!-- Terminal prompt lines -->
  <text x="165" y="125" font-family="'Courier New', monospace" font-size="12" fill="#00ff88">$ ./hack_scan.py --target example.com</text>
  <text x="165" y="142" font-family="'Courier New', monospace" font-size="11" fill="#666688">└─ 18 modules · 7-phase kill chain · full OWASP coverage</text>

  <!-- Status indicators -->
  <g transform="translate(165, 160)">
    <rect x="0" y="0" width="90" height="22" rx="4" fill="#1a1a2e" stroke="#00ff88" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#00ff88"/>
    <text x="22" y="15" font-family="'Courier New', monospace" font-size="10" fill="#00ff88">RECON</text>

    <rect x="100" y="0" width="90" height="22" rx="4" fill="#1a1a2e" stroke="#ffaa00" stroke-width="1"/>
    <circle cx="112" cy="11" r="4" fill="#ffaa00"/>
    <text x="122" y="15" font-family="'Courier New', monospace" font-size="10" fill="#ffaa00">EXPLOIT</text>

    <rect x="200" y="0" width="90" height="22" rx="4" fill="#1a1a2e" stroke="#ff0044" stroke-width="1"/>
    <circle cx="212" cy="11" r="4" fill="#ff0044"/>
    <text x="222" y="15" font-family="'Courier New', monospace" font-size="10" fill="#ff0044">REPORT</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.6">
    <path d="M10 10 L30 10 M10 10 L10 30"/>
    <path d="M830 10 L810 10 M830 10 L830 30"/>
    <path d="M10 190 L30 190 M10 190 L10 170"/>
    <path d="M830 190 L810 190 M830 190 L830 170"/>
  </g>
</svg>
